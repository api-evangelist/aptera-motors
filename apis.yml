aid: aptera-motors
name: Aptera Motors
description: 'Aptera Motors Corp. (Nasdaq: SEV) is a Carlsbad, California solar electric
  vehicle manufacturer founded by Steve Fambro and Chris Anthony. The company builds
  a three-wheeled, two-seat enclosed autocycle covered in roughly 700 watts of integrated
  solar cells, designed to add up to 40 miles of range per day from sunlight alone
  and to travel up to 10,000 miles a year on free solar power, with a 400-mile battery
  range on the Launch Edition, over 320 MPGe efficiency, a ~2,200 lb curb weight and
  0-60 mph in under six seconds. Aptera sells reservations direct to consumers through
  its own configurator, runs a branded Shopify merchandise storefront, and has committed
  to open-source driver assistance by integrating comma.ai openpilot into the vehicle.
  Aptera publishes no public developer program, API documentation, or machine-readable
  API contract as of this enrichment pass.'
