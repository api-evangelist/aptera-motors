apis:
- name: Aptera Shop Storefront Agent Commerce API
  description: 'The agent-facing commerce surface of Aptera Motors'' branded merchandise
    storefront at shop.aptera.us. It is a Model Context Protocol server (protocol
    2025-06-18) answering anonymously at /api/mcp with five verified tools —
    search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs — backed by a Universal Commerce Protocol
    2026-04-08 merchant profile at /.well-known/ucp and an OAuth 2.0 / OpenID
    Connect customer-account authorization server. Note: this surface is provided by
    the Shopify platform rather than authored by Aptera Motors, and it covers
    merchandise only. Aptera publishes no vehicle, reservation, or telemetry API and
    no OpenAPI definition.'
